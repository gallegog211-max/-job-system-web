{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<section class="panel">
  <h2>Log In</h2>

  {% if error %}
    <p class="status error">{{ error }}</p>
  {% endif %}
  {% if success %}
    <p class="status success">{{ success }}</p>
  {% endif %}

  <form action="{{ url_for('login_page') }}" method="post">
    <input type="hidden" name="next" value="{{ next or '' }}">

    <label>Username</label>
    <input type="text" name="username" value="{{ username or '' }}" required autofocus>

    <label>Password</label>
    <div class="password-field">
      <input type="password" name="password" id="login-password" autocomplete="current-password" required>
      <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password">👁</button>
    </div>
    <p class="hint"><a href="{{ url_for('forgot_password_page') }}">Forgot password?</a></p>

    <button type="submit" class="btn-primary">Log In</button>
  </form>

  <p class="hint">New applicant? <a href="{{ url_for('register_page') }}">Create an account</a>.</p>
</section>

<style>
  .password-field { position: relative; display: flex; align-items: center; }
  .password-field input { flex: 1; padding-right: 2.5rem; }
  .toggle-password {
    position: absolute; right: 0.6rem; background: none; border: none;
    cursor: pointer; font-size: 1.1rem; line-height: 1;
  }
  .status.success { color: var(--success, #4caf50); }
</style>

<script>
  document.querySelectorAll(".toggle-password").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var input = document.getElementById(btn.dataset.target);
      var showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.textContent = showing ? "👁" : "🙈";
      btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    });
  });
</script>
{% endblock %}
